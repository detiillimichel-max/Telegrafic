<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OIO ONE - Vibe Ecosystem</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <style>
        /* --- CORE: Variáveis de Luxo --- */
        :root { 
            --accent: #00e5ff; 
            --love: #ff0055; 
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --blur: blur(20px);
        }
        * { margin:0; padding:0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { background:#000; height:100vh; width:100vw; overflow:hidden; position:fixed; font-family: -apple-system, sans-serif; color: #fff; }
        
        /* --- BACKGROUND --- */
        video#bg-video { position:absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; z-index: 1; filter: brightness(0.25); }
        
        /* --- TOPO: Seleção de Usuários --- */
        #contatos-topo { position: absolute; top: env(safe-area-inset-top, 20px); left: 0; width: 100%; z-index: 500; display: flex; gap: 15px; padding: 10px 20px; overflow-x: auto; scrollbar-width: none; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        #contatos-topo::-webkit-scrollbar { display: none; }
        .contato-item { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 5px; opacity: 0.5; transition: 0.4s; cursor: pointer; }
        .contato-item.active { opacity: 1; transform: scale(1.1); }
        .contato-photo { width: 50px; height: 50px; border-radius: 50%; border: 2px solid transparent; background-size: cover; background-position: center; transition: 0.3s; }
        .contato-item.active .contato-photo { border-color: var(--accent); box-shadow: 0 0 15px rgba(0,229,255,0.4); }

        /* --- BOTÕES FLUTUANTES (FABs) --- */
        .btn-games-jump { position: absolute; top: 100px; right: 20px; z-index: 2000; color: var(--accent); font-size: 26px; text-decoration: none; animation: pulse 2s infinite; background: var(--glass); padding: 12px; border-radius: 50%; backdrop-filter: var(--blur); }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(0, 229, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0); } }

        .btn-main { position:absolute; right:20px; bottom:120px; width:65px; height:65px; border-radius:50%; background:var(--accent); color:#000; font-size:28px; border:none; z-index:1500; display:flex; align-items:center; justify-content:center; box-shadow: 0 10px 25px rgba(0,229,255,0.4); transition: 0.3s; }
        .btn-main:active { transform: scale(0.9); }

        /* --- SEÇÕES (MÓDULOS) --- */
        section { display:none; position:fixed; inset:0; z-index:1000; flex-direction:column; background: rgba(0,0,0,0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); }
        section.active { display:flex; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        
        /* --- FEED DE VÍDEOS --- */
        #feed-header { padding: 50px 20px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); }
        #feed-videos { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 150px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .video-card { width: 100%; aspect-ratio: 9/16; background: #111; border-radius: 18px; overflow: hidden; border: 1px solid var(--glass-border); position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .video-card video { width: 100%; height: 100%; object-fit: cover; }
        .like-box { position: absolute; bottom: 10px; right: 10px; display: flex; flex-direction: column; align-items: center; z-index: 10; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); padding: 8px 6px; border-radius: 15px; border: 1px solid var(--glass-border); }
        .btn-heart { font-size: 22px; color: #fff; cursor: pointer; transition: 0.2s; }
        .btn-heart.liked { color: var(--love); animation: pop 0.3s; }
        @keyframes pop { 50% { transform: scale(1.4); } }

        /* --- CHAT PREMIUM --- */
        #chat-header { padding: 50px 20px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); background: rgba(0,0,0,0.5); }
        #chat-container { flex:1; overflow-y:auto; padding: 20px; display:flex; flex-direction:column; gap:12px; scroll-behavior: smooth; }
        .msg { padding:14px 18px; border-radius:20px; max-width:82%; background:var(--glass); border: 1px solid var(--glass-border); line-height: 1.4; font-size: 15px; position: relative; }
        .msg.sent { align-self: flex-end; background: linear-gradient(135deg, #0072ff, #00c6ff); border: none; color: #fff; border-bottom-right-radius: 4px; }
        .msg.received { align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg img, .msg video, .msg audio { max-width: 100%; border-radius: 12px; margin-top: 8px; border: 1px solid var(--glass-border); }
        .msg-author { font-size: 10px; opacity: 0.6; margin-bottom: 4px; display: block; }

        /* --- CONTROLADOR ERGONÔMICO (Input de Chat) --- */
        .controlador { display: flex; align-items: center; gap: 12px; padding: 12px 15px; background: rgba(10,10,10,0.9); border-top: 1px solid var(--glass-border); padding-bottom: env(safe-area-inset-bottom, 20px); backdrop-filter: var(--blur); }
        .btn-vibe { color: var(--accent); font-size: 24px; cursor: pointer; transition: 0.2s; }
        .btn-vibe:active { transform: scale(0.8); }
        .input-wrapper { flex: 1; position: relative; }
        .input-wrapper input { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 14px 20px; border-radius: 25px; outline: none; font-size: 16px; transition: 0.3s; }
        .input-wrapper input:focus { border-color: var(--accent); }
        
        /* Botão Postar Centralizado */
        .btn-post { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); padding:16px 40px; border-radius:30px; background:var(--accent); border:none; font-weight:bold; color:#000; z-index:1100; box-shadow: 0 5px 20px rgba(0,229,255,0.3); font-size: 16px; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>

    <video id="bg-video" loop playsinline autoplay muted src="https://assets.mixkit.co/videos/preview/mixkit-abstract-technology-network-connection-background-27898-large.mp4"></video>

    <div id="contatos-topo">
        <div class="contato-item" id="item-Michel" onclick="trocarUser('Michel', this)">
            <div class="contato-photo" style="background-image: url('https://github.com/MichelDetilli.png')"></div>
            <span style="font-size:11px; font-weight:bold;">Michel</span>
        </div>
        <div class="contato-item" id="item-Bibibi" onclick="trocarUser('Bibibi', this)">
            <div class="contato-photo" style="background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=150&auto=format&fit=crop')"></div>
            <span style="font-size:11px; font-weight:bold;">Bibibi</span>
        </div>
    </div>

    <a href="games.html" class="btn-games-jump"><i class="fa-solid fa-gamepad"></i></a>
    <button class="btn-main" onclick="showPage('chat-page')"><i class="fa-solid fa-comment-dots"></i></button>

    <section id="videos-page" class="active">
        <div id="feed-header">
            <h2>Galeria Vibe</h2>
            <i class="fa-solid fa-plus btn-vibe" onclick="document.getElementById('videoInput').click()"></i>
        </div>
        <div id="feed-videos">
            </div>
        <button class="btn-post" onclick="document.getElementById('videoInput').click()">
            <i class="fa-solid fa-video"></i> Postar Vídeo
        </button>
    </section>

    <section id="chat-page">
        <div id="chat-header">
            <h2>Vibe Chat</h2>
            <i class="fa-solid fa-xmark btn-vibe" onclick="showPage('videos-page')"></i>
        </div>
        
        <div id="chat-container">
            </div>
        
        <div class="controlador">
            <i class="fa-solid fa-camera btn-vibe" onclick="document.getElementById('mediaInput').click()"></i>
            <i id="micBtn" class="fa-solid fa-microphone btn-vibe" onclick="toggleGravacao()"></i>
            
            <div class="input-wrapper">
                <input type="text" id="msgInput" placeholder="Sua vibe..." onkeypress="if(event.key === 'Enter') enviar()">
            </div>
            
            <i class="fa-solid fa-paper-plane btn-vibe" onclick="enviar()"></i>
        </div>
    </section>

    <input type="file" id="mediaInput" accept="image/*,video/*" style="display:none">
    <input type="file" id="videoInput" accept="video/*" style="display:none">

    <script>
        // 1. CONFIGURAÇÃO FIREBASE OIO ONE / VIBE
        const config = {
            apiKey: "AIzaSyAWL1XRR8JK-J5Qk5DSIKmBl4ZYMZw1R4I",
            databaseURL: "https://vibe-app-bbba2-default-rtdb.firebaseio.com/",
            projectId: "vibe-app-bbba2"
        };
        firebase.initializeApp(config);
        const db = firebase.database().ref("/");

        // 2. SISTEMA DE SONORIZAÇÃO
        const sfx = {
            click: new Audio('https://www.soundjay.com/buttons/sounds/button-16.mp3'),
            send: new Audio('https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3'),
            receive: new Audio('https://www.soundjay.com/buttons/sounds/button-20.mp3'),
            like: new Audio('https://www.soundjay.com/buttons/sounds/button-09.mp3')
        };

        // 3. IDENTIDADE E TROCA DE USUÁRIO
        window.meuNome = localStorage.getItem('oio_user') || "Michel";
        document.getElementById('item-' + window.meuNome).classList.add('active');

        function trocarUser(nome, el) {
            window.meuNome = nome;
            localStorage.setItem('oio_user', nome);
            document.querySelectorAll('.contato-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            sfx.click.play();
            renderizarChatLocal(); // Atualiza cores dos balões
        }

        // 4. NAVEGAÇÃO DE SEÇÕES
        function showPage(id) {
            sfx.click.play();
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'chat-page') {
                setTimeout(() => {
                    const c = document.getElementById('chat-container');
                    c.scrollTop = c.scrollHeight;
                }, 100);
            }
        }

        // 5. LÓGICA DA GALERIA DE VÍDEOS
        function curtir(id, btn) {
            db.child("videos_feed").child(id).child("likes").transaction(c => (c || 0) + 1);
            btn.classList.add('liked');
            sfx.like.play();
            if (window.navigator.vibrate) window.navigator.vibrate(50);
        }

        db.child("videos_feed").on('value', snap => {
            const feed = document.getElementById('feed-videos');
            feed.innerHTML = "";
            snap.forEach(c => {
                const v = c.val();
                const d = document.createElement('div'); d.className = "video-card";
                d.innerHTML = `
                    <video src="${v.url}" loop onclick="this.paused?this.play():this.pause()"></video>
                    <div class="like-box">
                        <i class="fa-solid fa-heart btn-heart" onclick="curtir('${c.key}', this)"></i>
                        <span style="font-size:12px; font-weight:bold; margin-top:3px">${v.likes||0}</span>
                    </div>`;
                feed.prepend(d); // Mais novos no topo
            });
        });

        // 6. LÓGICA DO CHAT MENSAGENS
        let mensagensLocais = []; // Guarda as msgs para re-renderizar ao trocar de user

        db.child("messages").limitToLast(30).on('value', snap => {
            mensagensLocais = [];
            snap.forEach(c => mensagensLocais.push(c.val()));
            renderizarChatLocal();
            // Toca som se a última mensagem não for sua
            if(mensagensLocais.length > 0 && mensagensLocais[mensagensLocais.length-1].autor !== window.meuNome) {
                sfx.receive.play();
            }
        });

        function renderizarChatLocal() {
            const container = document.getElementById('chat-container');
            container.innerHTML = "";
            mensagensLocais.forEach(m => {
                const isMe = m.autor === window.meuNome;
                const d = document.createElement('div');
                d.className = "msg " + (isMe ? "sent" : "received");
                
                let conteudo = `<span class="msg-author">${m.autor}</span>`;
                if(m.texto) conteudo += `<div>${m.texto}</div>`;
                if(m.url) conteudo += `<img src="${m.url}">`;
                if(m.videoUrl) conteudo += `<video controls src="${m.videoUrl}"></video>`;
                if(m.audioUrl) conteudo += `<audio controls src="${m.audioUrl}"></audio>`;
                
                d.innerHTML = conteudo;
                container.appendChild(d);
            });
            container.scrollTop = container.scrollHeight;
        }

        function enviar() {
            const i = document.getElementById('msgInput');
            if(i.value.trim()){ 
                db.child("messages").push({ autor: window.meuNome, texto: i.value }); 
                i.value = ""; 
                sfx.send.play();
            }
        }

        // 7. GRAVAÇÃO DE ÁUDIO E UPLOAD DE MÍDIA
        let mediaRecorder; let audioChunks = [];
        async function toggleGravacao() {
            const micBtn = document.getElementById('micBtn');
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            db.child("messages").push({ autor: window.meuNome, audioUrl: reader.result });
                            sfx.send.play();
                        };
                    };
                    mediaRecorder.start(); 
                    micBtn.style.color = "red";
                    micBtn.classList.add('fa-beat'); // Animação gravando
                } catch(e) { alert("Permita o microfone!"); }
            } else { 
                mediaRecorder.stop(); 
                micBtn.style.color = "var(--accent)"; 
                micBtn.classList.remove('fa-beat');
            }
        }

        // Upload Chat (Foto/Video)
        document.getElementById('mediaInput').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onloadend = () => {
                    const isVideo = file.type.startsWith('video');
                    db.child("messages").push({ 
                        autor: window.meuNome, 
                        [isVideo ? 'videoUrl' : 'url']: reader.result 
                    });
                    sfx.send.play();
                };
            }
        };

        // Upload Galeria (Video Feed)
        document.getElementById('videoInput').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onloadend = () => {
                    db.child("videos_feed").push({ url: reader.result, likes: 0, autor: window.meuNome });
                    sfx.send.play();
                    showPage('videos-page');
                };
            }
        };
    </script>
</body>
</html>
